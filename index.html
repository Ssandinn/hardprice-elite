<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardPrice Elite</title>

<style>
body{margin:0;background:#09090b;color:white;font-family:Arial,sans-serif}
header{background:#020617;padding:35px 20px;text-align:center;border-bottom:1px solid #27272a}
header h1{margin:0;font-size:42px}
header p{color:#a1a1aa}
main{max-width:1200px;margin:auto;padding:25px}
h2{color:#22c55e;margin-top:35px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:20px;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#22c55e}
.badge{display:inline-block;background:#dc2626;color:white;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold}
.card h3{font-size:18px;min-height:55px}
.price{font-size:30px;color:#22c55e;font-weight:bold}
.store{color:#d4d4d8}
.btn{display:block;text-align:center;margin-top:15px;background:#f59e0b;color:black;font-weight:bold;padding:13px;border-radius:12px;text-decoration:none}
.btn:hover{background:#fbbf24}
.empty{background:#18181b;padding:20px;border-radius:14px;color:#a1a1aa}
footer{text-align:center;color:#71717a;padding:30px}
</style>
</head>

<body>

<header>
  <h1>🔥 HardPrice Elite</h1>
  <p>Ofertas de processadores e placas de vídeo AMD/NVIDIA</p>
</header>

<main>
  <h2>🧠 Processadores</h2>
  <div id="cpus" class="grid">Carregando...</div>

  <h2>🎮 Placas de Vídeo</h2>
  <div id="gpus" class="grid">Carregando...</div>
</main>

<footer>
  HardPrice Elite — Ofertas atualizadas automaticamente
</footer>

<script>
const API_URL = "https://tzrswsufnerjvprznscs.supabase.co/rest/v1/offers?select=*";

const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cnN3c3VmbmVyanZwcnpuc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzg5OTEsImV4cCI6MjA5MjcxNDk5MX0.eF23le7QW6RuiBES-j42gslUQjTcml1JTyF9tcCbrVM";

async function carregar() {
  const res = await fetch(API_URL, {
    headers: {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + ANON_KEY
    }
  });

  const dados = await res.json();
  dados.sort((a,b)=>Number(a.price)-Number(b.price));

  const cpus = dados.filter(item => item.type && item.type.toLowerCase() === "cpu");
  const gpus = dados.filter(item => item.type && item.type.toLowerCase() === "gpu");

  render("cpus", cpus);
  render("gpus", gpus);
}

function render(id, lista) {
  const div = document.getElementById(id);

  if (!lista.length) {
    div.innerHTML = `<div class="empty">Nenhuma oferta encontrada.</div>`;
    return;
  }

  div.innerHTML = lista.map(item => `
    <div class="card">
      <span class="badge">🔥 OFERTA</span>
      <h3>${item.name}</h3>
      <div class="price">R$ ${item.price}</div>
      <p class="store">🏪 ${item.store}</p>
      <a class="btn" href="${item.link || "#"}" target="_blank">Comprar agora</a>
    </div>
  `).join("");
}

carregar();
</script>

</body>
</html>
