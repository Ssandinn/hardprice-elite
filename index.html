<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HardPrice Elite</title>

  <style>
    body {
      margin: 0;
      background: #09090b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .hero {
      background: linear-gradient(135deg, #18181b, #27272a);
      border: 1px solid #3f3f46;
      border-radius: 22px;
      padding: 30px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 38px;
      margin: 0;
    }

    .subtitle {
      color: #a1a1aa;
      margin-top: 8px;
    }

    .section {
      margin-top: 30px;
    }

    h2 {
      color: #22c55e;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #18181b;
      border-radius: 14px;
      overflow: hidden;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #27272a;
      text-align: left;
    }

    th {
      background: #27272a;
      color: #d4d4d8;
    }

    tr:hover {
      background: #222225;
    }

    .price {
      color: #22c55e;
      font-weight: bold;
      font-size: 18px;
    }

    .btn {
      background: #22c55e;
      color: black;
      padding: 9px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
    }

    .empty {
      color: #a1a1aa;
      background: #18181b;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="hero">
      <h1>🔥 HardPrice Elite</h1>
      <p class="subtitle">
        Ofertas de processadores e placas de vídeo NVIDIA/AMD atualizadas automaticamente.
      </p>
    </div>

    <div class="section">
      <h2>🧠 Processadores</h2>
      <div id="cpus">Carregando processadores...</div>
    </div>

    <div class="section">
      <h2>🎮 Placas de Vídeo</h2>
      <div id="gpus">Carregando placas de vídeo...</div>
    </div>
  </div>

<script>
const API_URL = "https://tzrswsufnerjvprznscs.supabase.co/rest/v1/offers?select=*";

const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cnN3c3VmbmVyanZwcnpuc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzg5OTEsImV4cCI6MjA5MjcxNDk5MX0.eF23le7QW6RuiBES-j42gslUQjTcml1JTyF9tcCbrVM";

async function carregar() {
  const res = await fetch(API_URL, {
    headers: {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + ANON_KEY
    }
  });

  const dados = await res.json();

  const cpus = dados.filter(item =>
    item.type && item.type.toLowerCase() === "cpu"
  );

  const gpus = dados.filter(item =>
    item.type && item.type.toLowerCase() === "gpu"
  );

  renderTabela("cpus", cpus);
  renderTabela("gpus", gpus);
}

function renderTabela(id, itens) {
  const div = document.getElementById(id);

  if (!itens.length) {
    div.innerHTML = `<div class="empty">Nenhuma oferta encontrada.</div>`;
    return;
  }

  div.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Loja</th>
          <th>Preço</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody>
        ${itens.map(item => `
          <tr>
            <td>${item.name}</td>
            <td>${item.store}</td>
            <td class="price">R$ ${item.price}</td>
            <td>
              <a class="btn" href="${item.link}" target="_blank">
                Comprar
              </a>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

carregar();
</script>

</body>
</html>
