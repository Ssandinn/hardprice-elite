<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardPrice Elite</title>

<style>
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #020617;
  padding: 24px;
  text-align: center;
  border-bottom: 1px solid #1e293b;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  color: #94a3b8;
  margin-top: 8px;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 24px;
}

h2 {
  margin-top: 35px;
  color: #22c55e;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}

.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 18px;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #22c55e;
}

.tag {
  display: inline-block;
  background: #14532d;
  color: #86efac;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 12px;
  margin-bottom: 10px;
}

.card h3 {
  font-size: 18px;
  min-height: 48px;
}

.price {
  font-size: 26px;
  font-weight: bold;
  color: #22c55e;
}

.store {
  color: #cbd5e1;
}

.btn {
  display: inline-block;
  margin-top: 14px;
  background: #f59e0b;
  color: black;
  font-weight: bold;
  padding: 10px 14px;
  border-radius: 10px;
  text-decoration: none;
}

.empty {
  background: #1e293b;
  padding: 20px;
  border-radius: 14px;
  color: #94a3b8;
}

footer {
  text-align: center;
  color: #64748b;
  padding: 30px;
}
</style>
</head>

<body>

<header>
  <h1>🔥 HardPrice Elite</h1>
  <p>Ofertas de processadores e placas de vídeo AMD/NVIDIA</p>
</header>

<main>
  <h2>🧠 Processadores</h2>
  <div id="cpus" class="grid">Carregando...</div>

  <h2>🎮 Placas de Vídeo</h2>
  <div id="gpus" class="grid">Carregando...</div>
</main>

<footer>
  HardPrice Elite — Ofertas atualizadas automaticamente
</footer>

<script>
const API_URL = "https://tzrswsufnerjvprznscs.supabase.co/rest/v1/offers?select=*";

const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6cnN3c3VmbmVyanZwcnpuc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzg5OTEsImV4cCI6MjA5MjcxNDk5MX0.eF23le7QW6RuiBES-j42gslUQjTcml1JTyF9tcCbrVM";

async function carregar() {
  const res = await fetch(API_URL, {
    headers: {
      "apikey": ANON_KEY,
      "Authorization": "Bearer " + ANON_KEY
    }
  });

  const dados = await res.json();

  dados.sort((a, b) => a.price - b.price);

  const cpus = dados.filter(item => item.type && item.type.toLowerCase() === "cpu");
  const gpus = dados.filter(item => item.type && item.type.toLowerCase() === "gpu");

  render("cpus", cpus);
  render("gpus", gpus);
}

function render(id, lista) {
  const div = document.getElementById(id);

  if (!lista.length) {
    div.innerHTML = `<div class="empty">Nenhuma oferta encontrada.</div>`;
    return;
  }

  div.innerHTML = lista.map(item => `
    <div class="card">
      <span class="tag">${item.type}</span>
      <h3>${item.name}</h3>
      <div class="price">R$ ${item.price}</div>
      <p class="store">🏪 ${item.store}</p>
      <a class="btn" href="${item.link}" target="_blank">Comprar</a>
    </div>
  `).join("");
}

carregar();
</script>

</body>
</html>
