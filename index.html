<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HardPrice Elite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#09090b;color:white;font-family:Arial;padding:40px}
.container{max-width:900px;margin:auto}
.card{background:#18181b;padding:20px;border-radius:14px;margin:15px 0;border:1px solid #27272a}
h1{font-size:42px}
.price{font-size:24px;font-weight:bold;color:#22c55e}
.error{color:#f87171}
</style>
</head>
<body>
<div class="container">
  <h1>HardPrice Elite 🔥</h1>
  <div id="lista">Carregando ofertas...</div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
  "https://tzrswsufnerjvprznscs.supabase.co",
  "sb_publishable_SK3htiUMeFr9WE9OLgxJRA_n-EyYjvA"
);

async function loadData() {
  const lista = document.getElementById("lista");

  const { data, error } = await supabaseClient
    .from("offers")
    .select("*");

  if (error) {
    lista.innerHTML = `<p class="error">Erro: ${error.message}</p>`;
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML = "<p>Nenhuma oferta cadastrada ainda.</p>";
    return;
  }

  lista.innerHTML = data.map(item => `
    <div class="card">
      <h2>${item.name}</h2>
      <div class="price">R$ ${item.price}</div>
      <p>Loja: ${item.store}</p>
    </div>
  `).join("");
}

loadData();
</script>
</body>
</html>
